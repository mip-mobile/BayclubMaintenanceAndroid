name: Build Bayclub Mobile Release APK Only

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Check signing secrets and restore keystore
        env:
          BAYCLUB_KEYSTORE_BASE64: ${{ secrets.BAYCLUB_KEYSTORE_BASE64 }}
          BAYCLUB_STORE_PASSWORD: ${{ secrets.BAYCLUB_STORE_PASSWORD }}
          BAYCLUB_KEY_ALIAS: ${{ secrets.BAYCLUB_KEY_ALIAS }}
          BAYCLUB_KEY_PASSWORD: ${{ secrets.BAYCLUB_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BAYCLUB_KEYSTORE_BASE64:-}"
          test -n "${BAYCLUB_STORE_PASSWORD:-}"
          test -n "${BAYCLUB_KEY_ALIAS:-}"
          test -n "${BAYCLUB_KEY_PASSWORD:-}"
          printf '%s' "$BAYCLUB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bayclub-release.jks"
          test -s "$RUNNER_TEMP/bayclub-release.jks"
          chmod 600 "$RUNNER_TEMP/bayclub-release.jks"

      - name: Build signed release APK
        env:
          BAYCLUB_KEYSTORE_PATH: ${{ runner.temp }}/bayclub-release.jks
          BAYCLUB_STORE_PASSWORD: ${{ secrets.BAYCLUB_STORE_PASSWORD }}
          BAYCLUB_KEY_ALIAS: ${{ secrets.BAYCLUB_KEY_ALIAS }}
          BAYCLUB_KEY_PASSWORD: ${{ secrets.BAYCLUB_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/Bayclub-Maintenance.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose artifacts/Bayclub-Maintenance.apk
          echo "Release build completed. Version: $(grep -E "versionName|versionCode" app/build.gradle | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bayclub-Mobile-v1.1.8-Release
          path: artifacts/Bayclub-Maintenance.apk
          if-no-files-found: error
          retention-days: 30
